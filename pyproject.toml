[project]
name = "enveloppes"
version = "0.1.0"
description = "Simulation engine comparing CTO (Compte Titres Ordinaire) vs AV (Assurance Vie) fiscal envelopes."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "matplotlib",
    "fastapi",
    "uvicorn",
    "pydantic",
    "pillow"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "httpx"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["enveloppes*", "api*"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PIE", "RUF", "N", "ARG", "S"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
